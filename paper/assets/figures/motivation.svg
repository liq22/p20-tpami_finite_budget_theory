<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 880" width="180mm" height="110mm" role="img"><title>Coordinates, search and information must be separated</title><desc>Three matched estimators share a fixed response problem. The union emulator duplicates a routed block without extra model queries.</desc><defs><marker id="arrowhead" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#304451" /></marker></defs><rect id="background" x="0" y="0" width="1440" height="880" rx="12" fill="#ffffff" stroke="#89979f" stroke-width="1.8" /><text id="title" x="44" y="59" font-family="DejaVu Sans, sans-serif" font-size="35" font-weight="bold" fill="#172b37">Separate coordinate gains from support-selection gains</text><rect id="fixed-problem" x="44" y="90" width="1352" height="142" rx="12" fill="#edf3f5" stroke="#89979f" stroke-width="1.8" /><text id="fixed-label" x="68" y="127" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#172b37">FIXED EXPLANATORY PROBLEM</text><text id="fixed-response" x="68" y="173" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="normal" fill="#172b37">dₓ(v) = s(x) − s(x − v)</text><text id="fixed-semantics" x="655" y="168" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="normal" fill="#172b37">predictor s  ·  target  ·  intervention law μₓ</text><text id="fixed-information" x="68" y="213" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="normal" fill="#172b37">same k, Q  ·  development information D  ·  available context z  ·  fresh scoring displacements</text><line id="fixed-to-panel-0" x1="262" y1="234" x2="262" y2="270" stroke="#304451" stroke-width="2.5" marker-end="url(#arrowhead)" /><line id="fixed-to-panel-1" x1="720" y1="234" x2="720" y2="270" stroke="#304451" stroke-width="2.5" marker-end="url(#arrowhead)" /><line id="fixed-to-panel-2" x1="1178" y1="234" x2="1178" y2="270" stroke="#304451" stroke-width="2.5" marker-end="url(#arrowhead)" /><rect id="plain-union" x="44" y="281" width="436" height="337" rx="12" fill="#ffffff" stroke="#89979f" stroke-width="1.8" /><rect id="route" x="502" y="281" width="436" height="337" rx="12" fill="#ffffff" stroke="#89979f" stroke-width="1.8" /><rect id="matched-union" x="960" y="281" width="436" height="337" rx="12" fill="#ffffff" stroke="#89979f" stroke-width="1.8" /><text id="a" x="67" y="325" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="bold" fill="#172b37">a   Plain union-OMP</text><text id="b" x="525" y="325" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="bold" fill="#172b37">b   Context route</text><text id="c" x="983" y="325" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="bold" fill="#172b37">c   Matched union</text><text id="union-dictionary" x="68" y="378" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="normal" fill="#172b37">Ψ(v) = [A₀v; …; A(J−1)v]</text><text id="union-search" x="68" y="424" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="normal" fill="#172b37">Search over all candidate atoms</text><text id="union-limit" x="68" y="463" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="normal" fill="#172b37">At most k nonzeros in total</text><text id="union-ambiguity-1" x="68" y="528" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="normal" fill="#172b37">Larger search space may change</text><text id="union-ambiguity-2" x="68" y="564" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="normal" fill="#172b37">finite-query estimation error</text><text id="route-selector" x="527" y="379" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="normal" fill="#172b37">(D, x, z, T_Q) → j, â</text><text id="route-prediction" x="527" y="428" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="normal" fill="#172b37">Response prediction: âᵀAⱼv</text><text id="route-support" x="527" y="468" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="normal" fill="#172b37">One block; at most k nonzeros</text><text id="route-fixed-gate" x="527" y="530" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="normal" fill="#172b37">Choose j before scoring v</text><text id="route-context" x="527" y="565" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="normal" fill="#172b37">Context constrains support</text><text id="emulate-padding" x="985" y="379" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="normal" fill="#172b37">ã = [0; …; â; …; 0]</text><text id="emulate-equality" x="985" y="429" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="bold" fill="#172b37">ãᵀΨ(v) = âᵀAⱼv</text><text id="emulate-support" x="985" y="472" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="normal" fill="#172b37">Same total k; same Q queries</text><text id="emulate-class-1" x="985" y="532" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="normal" fill="#172b37">Fixed dictionary does not mean</text><text id="emulate-class-2" x="985" y="566" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="normal" fill="#172b37">fixed support or coefficients</text><line id="route-to-emulator" x1="899" y1="642" x2="1163" y2="642" stroke="#304451" stroke-width="2.5" marker-end="url(#arrowhead)" /><text id="emulation-label" x="561" y="652" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="normal" fill="#172b37">same rule + information</text><rect id="interpretation" x="44" y="682" width="1352" height="153" rx="12" fill="#edf3f5" stroke="#89979f" stroke-width="1.8" /><text id="interpretation-title" x="68" y="720" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#172b37">DECISIVE CONTROL</text><text id="interpretation-statement" x="68" y="758" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="normal" fill="#172b37">If b beats a but equals c, the contrast does not isolate an intrinsic routing advantage.</text><text id="recorded-outcome" x="68" y="801" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="normal" fill="#172b37">Executed synthetic check: max |prediction(b) − prediction(c)| = 0;  Q = 3, 6, 12, 24.</text><text id="footer" x="45" y="861" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="normal" fill="#172b37">Class containment is exact; practical cost and real-data coordinate benefits require separate evidence.</text></svg>