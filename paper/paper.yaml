schema_version: 1
project_name: P20 finite-budget response geometry
paper_title: 'When Coordinates Help: Finite-Budget Response Explanations'
short_title: Fixed-response coordinate budgets
language: English
paper_stage: markdown_draft
active_source: markdown
draft_source:
  path: paper/draft/main.md
formal_source:
  path: paper/tex/main.tex
freeze:
  frozen: false
problem_definition:
  object: Sparse finite-query response explanations of a fixed predictor
  environment: Common original-space interventions and independent unit splits
  observation: Scalar target-score differences and declared context
  task_or_decision: Separate coordinate approximation from search, estimation and information effects
  failure_or_contradiction: Same-information union emulates every routed decoder at any finite query budget
  desired_understanding: Conditions for practically useful shared coordinates under matched estimators
research_state:
  central_question: When do shared coordinates improve finite-query response prediction under identical semantics and information?
  current_claim_at_risk: Independent benefit beyond task-driven transforms and structured support selection
  strongest_support: Conditional geometry and exact emulation; controlled nonlinear negative comparison
  favored_explanation: Response training may add value only when nonlinear, anisotropic or finite-query estimation terms make oracle attribution-tail sparsity insufficient
  strongest_competing_explanation: In the linear-isotropic limit attribution-tail already equals the coordinate oracle, while support priors explain finite-Q gains
  largest_unresolved_uncertainty: Independent PHM real-data benefit over non-degenerate matched objectives and structured-support controls
  current_novelty_risk: Projection, learned transforms, bilevel dictionaries and instancewise selection already exist
  most_informative_next_action: Run one frozen-predictor PHM pilot comparing response, sparse-reconstruction and attribution-tail objectives under one aggregation and response table
  possible_outcomes_and_decisions: Retain bounded gains; narrow or reject on null effects
  stopping_condition: Do not promote performance claims without independent matched evidence
main_claims:
  - claim_id: C1
    text: Fixed-response geometry separates approximation, support search and coefficient estimation
    status: conditional_derivation
  - claim_id: C2
    text: A shared orthogonal basis can optimize held-out-within-training finite-query response error
    status: implemented_reference_not_real_data_confirmed
  - claim_id: C3
    text: Same-information fixed-union coefficients exactly emulate a finite-query routed decoder
    status: conditional_proof_and_controlled_numerical_check
main_contributions:
  - contribution_id: K1
    text: Budgeted coordinate-comparison formulation and containment boundary
    supporting_claims: [C1, C3]
  - contribution_id: K2
    text: Shared-coordinate finite-query response objective with non-degenerate matched-objective controls and independent candidate selection
    supporting_claims: [C2]
  - contribution_id: K3
    text: Information-matched negative control for interpreting finite-query routing gains
    supporting_claims: [C3]
required_experiments:
  - experiment_id: E1
    text: Exact geometry and finite-query emulation tests
    supports_claims: [C1, C3]
  - experiment_id: E2
    text: One PHM falsification pilot with matched objectives and structured supports before broader generality
    supports_claims: [C2]
